<div class="monitor-header">
  <div class="token-total" title="Tokens used by all agents (input + output)">
    <span class="token-total-value">{{ totalEstimated() ? '~' : '' }}{{ totalTokens() }}</span>
    <span class="token-total-label">total tokens</span>
  </div>
  <ul class="legend">
    <li><span class="swatch idle"></span>Idle</li>
    <li><span class="swatch working"></span>Working</li>
    <li><span class="swatch done"></span>Done</li>
  </ul>
</div>
<div #host class="scene-host"></div>
